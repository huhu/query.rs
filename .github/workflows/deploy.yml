name: Build and deploy query.rs

on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3
        with:
          ref: 'main'
          submodules: 'recursive'
      - name: Build website
        run: |
          npm install && npm run build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Same Pages project, output directory, and production branch as the previous action.
          # --branch is required: actions/checkout leaves a detached HEAD, so Wrangler cannot infer "main".
          command: pages deploy .svelte-kit/cloudflare --project-name=query-rs --branch=main
          # Optional: Enable this if you want to have GitHub Deployments triggered
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Stay on Wrangler 3, matching the previous pin and package.json ("wrangler": "^3.99.0").
          wranglerVersion: "3"
