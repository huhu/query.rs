<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fcfaf6">
    <!-- Keep in sync with src/lib/theme.js (query-theme, #fcfaf6, #14120f). -->
    <script>
        (function () {
            var key = "query-theme";
            var pref = "system";
            try {
                var stored = localStorage.getItem(key);
                if (stored === "light" || stored === "dark" || stored === "system") pref = stored;
            } catch (e) {}
            var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            var dark = pref === "dark" || (pref === "system" && systemDark);
            var root = document.documentElement;
            root.setAttribute("data-theme", pref);
            root.classList.toggle("dark", dark);
            root.style.colorScheme = dark ? "dark" : "light";
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", dark ? "#14120f" : "#fcfaf6");
        })();
    </script>
    <style>
        html { background-color: #fcfaf6; color: #121212; }
        html.dark { background-color: #14120f; color: #f4efe6; }
    </style>
    <link rel="icon" type="image/png" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/16x16.png">
    <link rel="manifest" href="/assets/favicon/site.webmanifest">
    <meta name="keywords"
        content="search rust docs, search crates, search rust attributes, search rust books, search clippy lints, search rust RFCs, search error codes, search docs by type signature" />
    <link rel="search" href="/opensearch.xml" type="application/opensearchdescription+xml" title="Query.rs" />
    <link rel='stylesheet' href='%sveltekit.assets%/css/balloon.min.css'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    %sveltekit.head%
</head>

<body>
    <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
